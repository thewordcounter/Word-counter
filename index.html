<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Word Counter</title>
    <style>
        body { font-family: sans-serif; margin: 20px; text-align: center; }
        textarea { width: 80%; height: 200px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        .stats { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Simple Word Counter</h1>
    <textarea id="text" placeholder="Type or paste your text here..." oninput="count()"></textarea>
    <div class="stats">
        Words: <span id="wordCount">0</span> | Characters: <span id="charCount">0</span>
    </div>

    <script>
        function count() {
            var text = document.getElementById("text").value.trim();
            var words = text === "" ? 0 : text.split(/\s+/).length;
            var chars = text.length;
            document.getElementById("wordCount").innerText = words;
            document.getElementById("charCount").innerText = chars;
        }
    </script>
</body>
</html>
