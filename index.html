
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Word Counter</title>
    <style>
        :root {
            --primary-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --accent-color: #38bdf8;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin: 20px;
        }

        h1 {
            margin-top: 0;
            color: #1e293b;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 1rem;
            font-size: 1rem;
            font-family: inherit;
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.2s;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .stats {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 1.2rem;
            font-weight: 600;
            color: #475569;
        }

        .stats span {
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Word Counter</h1>
        <textarea id="text" placeholder="Type or paste your text here..." oninput="count()"></textarea>
        <div class="stats">
            Words: <span id="wordCount">0</span> | Characters: <span id="charCount">0</span>
        </div>
    </div>

    <script>
        function count() {
            var text = document.getElementById("text").value.trim();
            var words = text === "" ? 0 : text.split(/\s+/).length;
            var chars = text.length;
            document.getElementById("wordCount").innerText = words;
            document.getElementById("charCount").innerText = chars;
        }
    </script>
</body>
</html>


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and free word counter tool to count words and characters in your text.">
    <meta name="keywords" content="word counter, character count, text counter, free word counter tool">
    <title>Simple Word Counter</title>

</head>
